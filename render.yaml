# Render Blueprint: creates the database, the API and the website in one go.
# Render dashboard → New → Blueprint → pick this repository.
databases:
  - name: shop-db
    plan: free            # change to a paid plan for real use (free databases expire)
    databaseName: shop
    user: shop

services:
  - type: web
    name: shop-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shop-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: CORS_ORIGINS
        sync: false        # set to the website address, e.g. https://shop-web.onrender.com
      - key: PUBLIC_SITE_URL
        sync: false        # same website address; the QR code points here
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: owner
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false        # first owner password (min 8 chars); delete after first login

  - type: web
    name: shop-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # the API address, e.g. https://shop-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
